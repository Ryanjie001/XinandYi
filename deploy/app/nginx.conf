server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name 203.0.113.1;
 server_tokens off;
 location ^~ /.well-known/acme-challenge/ {
  root /var/www/xinanyi-acme;
  default_type text/plain;
 }
 location / { return 308 https://203.0.113.1$request_uri; }
}
server {
 listen 443 ssl http2 default_server;
 listen [::]:443 ssl http2 default_server;
 server_name 203.0.113.1;
 server_tokens off;
 ssl_certificate /etc/letsencrypt/live/xinanyi-ip/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/xinanyi-ip/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:xinanyi:5m;
 ssl_session_timeout 1d;
 client_max_body_size 13m;
 client_body_timeout 30s;
 keepalive_timeout 30s;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host 203.0.113.1;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";
  proxy_read_timeout 65s;
  proxy_send_timeout 65s;
  proxy_buffering off;
 }
}
